name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Show dotnet info
        run: dotnet --info

      - name: Restore & build ApiScaffold (net8.0)
        working-directory: Billing_Software/ApiScaffold
        run: |
          dotnet restore
          dotnet build -c Debug --no-restore

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Show MSBuild version
        shell: powershell
        run: |
          msbuild -version

      - name: List repository files (diagnostic)
        shell: powershell
        run: |
          Write-Host "Repository files (depth=2):"
          Get-ChildItem -Path . -Recurse -File -Depth 2 | ForEach-Object { Write-Host $_.FullName }

      - name: NuGet restore legacy solution (diagnostic)
        shell: powershell
        run: |
          Write-Host "Running nuget restore for solution (if available)..."
          if (Test-Path ./Billing_Software.slnx) {
            nuget restore ./Billing_Software.slnx
          } else {
            Write-Host "Billing_Software.slnx not found; skipping nuget restore."
          }

      - name: Build legacy WinForms project with MSBuild
        shell: powershell
        run: |
          # Build the WinForms project file directly (some runners may not accept .slnx)
          msbuild ./Billing_Software/Billing_Software.csproj /m /p:Configuration=Debug /p:WarningsAsErrors="CS8602;CS8604;CS8618;CS8625;CS8629;CS8632;CS0105;CS0219;CS0168;CS1998" /p:WarningLevel=4 /t:Rebuild
          if ($LASTEXITCODE -ne 0) { Write-Error "MSBuild exited with code $LASTEXITCODE"; exit $LASTEXITCODE }
