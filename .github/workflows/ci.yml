name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Show dotnet info
        run: dotnet --info

      - name: Restore & build ApiScaffold (net8.0)
        working-directory: Billing_Software/ApiScaffold
        run: |
          dotnet restore
          dotnet build -c Debug --no-restore

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Show MSBuild version
        shell: powershell
        run: |
          msbuild -version

      - name: Build legacy WinForms solution with MSBuild
        shell: powershell
        run: |
          # Build the solution with MSBuild (fail on curated warning list)
          msbuild ./Billing_Software.slnx /m /p:Configuration=Debug /p:WarningsAsErrors="CS8602;CS8604;CS8618;CS8625;CS8629;CS8632;CS0105;CS0219;CS0168;CS1998" /p:WarningLevel=4 /t:Rebuild
          if ($LASTEXITCODE -ne 0) { Write-Error "MSBuild exited with code $LASTEXITCODE"; exit $LASTEXITCODE }
