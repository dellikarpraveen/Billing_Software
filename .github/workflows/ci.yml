name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with MSBuild (fail on warnings)
        shell: powershell
        run: |
          Write-Host "Locating MSBuild via vswhere..."
          $vswhere = "$env:ProgramFiles(x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Error "vswhere not found at $vswhere"; exit 1 }
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find '**\MSBuild\**\Bin\MSBuild.exe'
          if ([string]::IsNullOrWhiteSpace($msbuild)) { Write-Error "MSBuild not found via vswhere"; exit 1 }
          Write-Host "MSBuild found: $msbuild"

          # Run a full rebuild and fail only on the selected warning codes
          # Quote the WarningsAsErrors value so PowerShell passes the semicolon-separated list as a single argument
          & $msbuild 'Billing_Software.slnx' /m /p:Configuration=Debug /p:WarningsAsErrors='CS8602;CS8604;CS8618;CS8625;CS8629;CS8632;CS0105;CS0219;CS0168;CS1998' /p:WarningLevel=4 /t:Rebuild
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Error "MSBuild exited with code $code"; exit $code }
